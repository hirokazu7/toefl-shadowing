 btn.disabled=true;msg.textContent='Gemini に送っています…';
 try{const txt=await gemCall([{text:wrPrompt(WR.type,WR.prompt,text)}],false,t=>{msg.textContent=t});const e=parseSecs(txt);if(!e){msg.textContent='返事を読み取れませんでした。もう一度押してください。';btn.disabled=false;return}
  const entry={date:today(),type:WR.type,prompt:WR.prompt||'',text,fb:e};const hist=wrState();hist.push(entry);LS.set('wr',hist.slice(-30));logN('wr');renderWrite()}
 catch(err){msg.textContent='送れませんでした：'+(err.message||err);btn.disabled=false}}
function parseSecs(txt){const t=txt.replace(/\r/g,'').replace(/\*\*/g,'').replace(/^#+\s*/gm,'');const parts=t.split(/【([^】]+)】/);const sec={};for(let i=1;i<parts.length;i+=2)sec[parts[i].trim()]=(parts[i+1]||'').trim();
 const get=k=>{const key=Object.keys(sec).find(x=>x.replace(/\s/g,'').toLowerCase().includes(k));return key!=null?sec[key]:''};
 const items=s=>s.split('\n').map(x=>x.trim()).filter(x=>/^[-・*•\d]/.test(x)).map(x=>x.replace(/^([-・*•]|\d+[.)．])\s*/,'')).filter(Boolean).map(x=>{const m=x.split(/\s*[|｜]\s*/);return m.length>1?{p:m[0],t:m.slice(1).join(' | ')}:{p:'',t:x}});
 const sc=get('予想点').match(/(\d(?:\.\d)?)/);
 const e={score:sc?+sc[1]:null,subj:items(get('主語')),good:items(get('good')),dev:items(get('development')),para:items(get('言い換え')),full:get('直した全文')||get('模範解答'),phr:items(get('使えるフレーズ')),next:get('次に直す'),heard:get('書き起こし')};
 if(!e.good.length&&!e.dev.length&&!e.full&&!e.heard)return null;return e}
function wrCard(en){const f=en.fb;const card=h('details',{class:'fbrow'},h('summary',null,h('b',{class:'num',text:en.date+'・'+(en.type==='email'?'Email':'Discussion')}),h('span',{class:'k num'},f.score!=null?h('span',null,'予想点 ',h('b',{text:f.score+' / 5'})):null,h('span',null,(en.text.match(/[A-Za-z']+/g)||[]).length+'語'))));
 if(f.next)card.append(h('p',{style:'margin:6px 0',text:'次に直す1点：'+f.next}));
 if(f.subj&&f.subj.length)card.append(h('div',{class:'dv'},h('div',{class:'tag dev',text:'主語・動詞チェック'}),f.subj.map(g=>h('div',{class:'pt'},g.p?h('div',{class:'en ph',text:g.p}):null,h('div',{text:g.t})))));
 if(f.good.length)card.append(h('div',{class:'gd'},h('div',{class:'tag good',text:'Good'}),f.good.map(g=>h('div',{class:'pt'},g.p?h('div',{class:'en ph',text:g.p}):null,h('div',{text:g.t})))));
 if(f.dev.length)card.append(h('div',{class:'dv'},h('div',{class:'tag dev',text:'Development'}),f.dev.map(g=>h('div',{class:'pt'},g.p?h('div',{class:'en ph',text:g.p}):null,h('div',{text:g.t})))));
 if(f.para&&f.para.length)card.append(paraRows(f.para));
 if(f.full){const sb=h('button',{class:'minibtn',type:'button',text:'模範解答をストック'});sb.onclick=()=>{stockAdd('answers',{cat:en.type==='email'?'Email':'Discussion',q:(en.prompt||'').slice(0,160),en:f.full});sb.textContent='追加済み';sb.disabled=true};
  card.append(h('details',{class:'heard',open:true},h('summary',{class:'small muted',text:'直した全文'}),h('p',{class:'en',style:'white-space:pre-wrap',text:f.full}),sb))}
 if(f.phr&&f.phr.length)card.append(h('div',{class:'gd',style:'background:var(--chip)'},h('div',{class:'tag',style:'background:var(--accent)',text:'使えるフレーズ'}),f.phr.map(p=>phraseRow(p,en.type==='email'?'Email':'Discussion'))));
 card.append(h('details',{class:'heard'},h('summary',{class:'small muted',text:'自分の回答'}),h('p',{class:'en small',style:'white-space:pre-wrap',text:en.text})));
 return card}

// ---------- lock (contents are encrypted on the server) ----------
const CRY={key:null,meta:null};
const hexd=h2=>new Uint8Array(h2.match(/../g).map(x=>parseInt(x,16)));
function b64e(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function b64d(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function deriveKey(pw,meta){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:hexd(meta.salt),iterations:meta.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function dec(buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},CRY.key,u.slice(12))}
async function loadData(){const r=await fetch('data.enc',{cache:'no-cache'});if(!r.ok)throw new Error('data '+r.status);const D=JSON.parse(new TextDecoder().decode(await dec(await r.arrayBuffer())));if(Array.isArray(D))ITEMS=D;else{ITEMS=D.items||[];SP=D.speak||SP}}
const AUD={};
async function audioUrl(id){if(AUD[id])return AUD[id];const r=await fetch('audio/'+id+'.enc');if(!r.ok)throw new Error('audio '+r.status);const pt=await dec(await r.arrayBuffer());return AUD[id]=URL.createObjectURL(new Blob([pt],{type:'audio/mpeg'}))}
function lockScreen(msg){const root=$('home');root.innerHTML='';
 const inp=h('input',{type:'text',id:'pass',autocomplete:'off',autocapitalize:'off',autocorrect:'off',spellcheck:'false','aria-label':'合言葉',placeholder:'合言葉',class:'passin'});const m=h('p',{class:'small',id:'lockmsg',text:msg});
 const go=h('button',{class:'btn primary',type:'button',text:'開く'});
 const run=async()=>{if(!inp.value)return;go.disabled=true;m.textContent='確認中…（数秒かかります）';
  try{CRY.key=await deriveKey(inp.value,CRY.meta);await loadData();const raw=new Uint8Array(await crypto.subtle.exportKey('raw',CRY.key));try{localStorage.setItem(PFX+'k',b64e(raw))}catch(e){}renderHome()}
  catch(e){m.textContent=/data \d/.test(e.message)?'読み込めませんでした（'+e.message+'）。':'合言葉が違います。';go.disabled=false}};
 go.onclick=run;inp.onkeydown=e=>{if(e.key==='Enter')run()};
 root.append(h('h1',{text:'TOEFL シャドーイング'}),h('p',{class:'small muted',text:'合言葉を入れてください。この端末では次回から入力不要です。'}),h('div',{class:'row'},inp,go),m)}
async function boot(){
 try{const r=await fetch('meta.json',{cache:'no-cache'});CRY.meta=await r.json()}catch(e){lockScreen('読み込めませんでした。通信を確認してください。');return}
 let saved=null;try{saved=localStorage.getItem(PFX+'k')}catch(e){}
 if(saved){try{CRY.key=await crypto.subtle.importKey('raw',b64d(saved),{name:'AES-GCM'},false,['decrypt']);await loadData();renderHome();return}catch(e){}}
 lockScreen('')}
boot();
