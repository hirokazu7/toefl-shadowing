<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><title>TOEFL シャドーイング</title>

<style>
/* Layout: list of materials → one-screen player with script on top, fixed transport at the bottom. Highlighter marks the line being spoken. */
:root{
  --bg:#f5f6f9;--surface:#ffffff;--ink:#16203a;--muted:#5f6b85;--line:#dfe3ec;
  --accent:#2f56d0;--accent-ink:#ffffff;--mark:#ffe58a;--mark-ink:#16203a;--good:#1f8a5b;--bad:#c2413b;--chip:#e9edf8;
  --en:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;

  --fs:20px;--mF:#c9620f;--mD:#7a68b8;--mL:#1d8496;--goodbg:#e8f5ee;--devbg:#fbecea;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1422;--surface:#171e30;--ink:#e6eaf4;--muted:#9aa6c2;--line:#2a3350;--accent:#7f9cff;--accent-ink:#0f1422;--mark:#5a4a12;--mark-ink:#fff6d6;--good:#4fc28d;--bad:#ff7a73;--chip:#222b45;--mF:#ffab5c;--mD:#b3a6ff;--mL:#5fd0e2;--goodbg:#15302a;--devbg:#3a1f22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1422;--surface:#171e30;--ink:#e6eaf4;--muted:#9aa6c2;--line:#2a3350;--accent:#7f9cff;--accent-ink:#0f1422;--mark:#5a4a12;--mark-ink:#fff6d6;--good:#4fc28d;--bad:#ff7a73;--chip:#222b45;--mF:#ffab5c;--mD:#b3a6ff;--mL:#5fd0e2;--goodbg:#15302a;--devbg:#3a1f22;color-scheme:dark}
html,body{height:100%}
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:15px}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ja);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.wrap{max-width:720px;margin:0 auto;padding-block:14px 24px}
h1{font-size:20px;margin:4px 0 2px;text-wrap:balance}
.muted{color:var(--muted)}.small{font-size:13px}
.en{font-family:var(--en)}
.num{font-variant-numeric:tabular-nums;font-family:var(--en)}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.stat b{font-size:18px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;white-space:nowrap;font-size:14px}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.item .t{font-weight:700;min-width:0}
.item .meta{font-size:12px;color:var(--muted)}

.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}

.catnote{font-size:13px;color:var(--muted);margin:-2px 0 10px}

.top{display:flex;align-items:center;gap:8px;padding-top:10px}

.top .ttl{min-width:0;flex:1}
.top .ttl>div:first-child{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 6px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 2px;font-size:12px;line-height:1.3;white-space:nowrap}
.steps button .n{display:block;font-family:var(--en);font-weight:700;font-size:13px}
.steps button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.steps button.done .n::after{content:" ✓";color:var(--good)}
.guide{background:var(--chip);border-radius:10px;padding:8px 12px;font-size:13px}
.guide b{font-weight:700}
.views{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap}
.views button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.script{flex:1;overflow-y:auto;min-height:0;padding:4px 2px 12px;-webkit-overflow-scrolling:touch}

.ln .who{font-family:var(--en);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ln.cur{background:var(--mark);color:var(--mark-ink)}
.ln.cur .j,.ln.cur .who{color:var(--mark-ink)}
.ln.loop{box-shadow:inset 3px 0 0 var(--accent)}
.mask{color:transparent;border-bottom:2px solid var(--muted)}
.ln.cur .mask{border-bottom-color:var(--mark-ink)}
.hiddenbox{border:1px dashed var(--line);border-radius:12px;padding:28px 12px;text-align:center;color:var(--muted);margin:20px 0}

.play{width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lbl{font-family:var(--en);font-size:11px;font-weight:700}
.ab{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:6px;font-size:13px}
.ab button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 12px}
.counter{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}

.sheet{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));z-index:20;box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:80vh;overflow-y:auto}
.sheet h3{margin:0 0 4px;font-size:14px;color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.row>span:first-child{min-width:92px;font-size:14px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:5px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.row input[type=range]{flex:1;accent-color:var(--accent);min-width:120px}
.shade{position:fixed;inset:0;background:rgba(10,14,25,.35);z-index:19}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.cur-card{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:10px 14px;margin:0 0 14px}
.cur-card .t{font-weight:700;font-size:16px}
.steps .cnt{display:block;font-size:11px;color:var(--muted);min-height:1em}
.views .mkbtn{margin-left:auto}
.views .mkbtn[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:2px 6px 8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.bd{font-style:normal;font-size:11px;font-weight:700;width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;color:#fff;flex:none}
.bF{background:var(--mF)}.bD{background:var(--mD)}.bL{background:var(--mL)}
.mk{text-decoration-line:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.mF{text-decoration-style:wavy;text-decoration-color:var(--mF)}
.mD{text-decoration-style:dotted;text-decoration-color:var(--mD);text-decoration-thickness:3px}
.mL{text-decoration-style:solid;text-decoration-color:var(--mL)}
.kc-row{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px}
.kc{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--chip);border-radius:6px;padding:1px 6px 1px 2px;line-height:1.6}
.ln.cur .kc{background:rgba(255,255,255,.45)}
.fb.fbtop{border-top:0;padding-top:0;margin:0 0 12px}
details.fbrow summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
details.fbrow .k{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted)}
details.fbrow .k b{color:var(--ink)}
.gd,.dv{margin-top:8px;border-radius:10px;padding:8px 10px}
.gd{background:var(--goodbg)}.dv{background:var(--devbg)}
.tag{display:inline-block;font-family:var(--en);font-weight:700;font-size:12px;border-radius:999px;padding:1px 10px;color:#fff}
.tag.good{background:var(--good)}.tag.dev{background:var(--bad)}
.pt{padding:6px 0;border-top:1px solid var(--line)}
.pt:first-of-type{border-top:0}
.pt .ph{font-weight:600}
.pastebox{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--ink);font:13px/1.5 var(--ja)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:2px 0}
details.heard{margin-top:6px}
.recrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.recbtn{border:1.5px solid var(--bad);color:var(--bad);background:var(--surface);border-radius:999px;padding:6px 16px;font-weight:700}
.recbtn.on{background:var(--bad);color:#fff}
.myrec{margin:8px 0}.myrec audio{width:100%;margin-top:4px}
details.manual{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.hometop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet input[type=password]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--ink)}
.sheet select{max-width:100%}
.player.playing .chrome,.player.playing .fb{display:none}
.chrome{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.chrome .steps{margin:6px 0 0}
.steps button{padding:4px 2px;font-size:11.5px;line-height:1.25}
.steps button .n{font-size:12px}
.views{margin:0;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.views button{padding:3px 9px;font-size:12px;white-space:nowrap;flex:none}
.top{padding-top:6px}
.iconbtn{width:36px;height:36px}
.bar{padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.ctrls{margin-top:2px}
.ctrls .iconbtn{width:42px;height:42px}
.play{width:54px;height:54px}
.mic{border-color:var(--bad);color:var(--bad);width:auto!important;padding:0 8px;border-radius:21px}
.mic.on{background:var(--bad);color:#fff}
.recrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;min-height:24px}
.minibtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:12px;flex:none}
.counter{margin-top:2px}
.recrow.rec-on{background:var(--bad);color:#fff;border-radius:12px;padding:6px 6px 6px 12px;font-weight:700}
.stopbtn{background:#fff;color:var(--bad);border:0;border-radius:999px;padding:6px 14px;font-weight:700;flex:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<script>

 back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',

 play:'<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',

 prev:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg>',

// ---------- storage: browser + private per-user store ----------
const PFX='shd:',MEM={};let COL=null;const pend={},tmr={};
const LS={get(k,d){if(k in MEM)return MEM[k];try{const v=localStorage.getItem(PFX+k);if(v!=null){MEM[k]=JSON.parse(v);return MEM[k]}}catch(e){}return d},

async function flush(k){if(!(k in pend))return;const v=pend[k];delete pend[k];try{await COL.doc(k).set({v:JSON.stringify(v)})}catch(e){}}

function b64e(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function b64d(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function deriveKey(pw,meta){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:hexd(meta.salt),iterations:meta.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function dec(buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},CRY.key,u.slice(12))}
async function loadData(){const r=await fetch('data.enc',{cache:'no-cache'});if(!r.ok)throw new Error('data '+r.status);ITEMS=JSON.parse(new TextDecoder().decode(await dec(await r.arrayBuffer())))}
const AUD={};
async function audioUrl(id){if(AUD[id])return AUD[id];const r=await fetch('audio/'+id+'.enc');if(!r.ok)throw new Error('audio '+r.status);const pt=await dec(await r.arrayBuffer());return AUD[id]=URL.createObjectURL(new Blob([pt],{type:'audio/mpeg'}))}
function lockScreen(msg){const root=$('home');root.innerHTML='';
 const inp=h('input',{type:'text',id:'pass',autocomplete:'off',autocapitalize:'off',autocorrect:'off',spellcheck:'false','aria-label':'合言葉',placeholder:'合言葉',class:'passin'});const m=h('p',{class:'small',id:'lockmsg',text:msg});
 const go=h('button',{class:'btn primary',type:'button',text:'開く'});
 const run=async()=>{if(!inp.value)return;go.disabled=true;m.textContent='確認中…（数秒かかります）';
  try{CRY.key=await deriveKey(inp.value,CRY.meta);await loadData();const raw=new Uint8Array(await crypto.subtle.exportKey('raw',CRY.key));try{localStorage.setItem(PFX+'k',b64e(raw))}catch(e){}renderHome()}
  catch(e){m.textContent=/data \d/.test(e.message)?'読み込めませんでした（'+e.message+'）。':'合言葉が違います。';go.disabled=false}};
 go.onclick=run;inp.onkeydown=e=>{if(e.key==='Enter')run()};
 root.append(h('h1',{text:'TOEFL シャドーイング'}),h('p',{class:'small muted',text:'合言葉を入れてください。この端末では次回から入力不要です。'}),h('div',{class:'row'},inp,go),m)}
async function boot(){
 try{const r=await fetch('meta.json',{cache:'no-cache'});CRY.meta=await r.json()}catch(e){lockScreen('読み込めませんでした。通信を確認してください。');return}
 let saved=null;try{saved=localStorage.getItem(PFX+'k')}catch(e){}
 if(saved){try{CRY.key=await crypto.subtle.importKey('raw',b64d(saved),{name:'AES-GCM'},false,['decrypt']);await loadData();renderHome();return}catch(e){}}
 lockScreen('')}
boot();
</script>
